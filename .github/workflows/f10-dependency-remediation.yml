name: F-10 Dependency Remediation

on:
  push:
    branches:
      - devops/f10-dependency-remediation

permissions:
  contents: write

jobs:
  remediate:
    name: Generate Patched Lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install baseline dependencies
        run: npm ci

      - name: Generate patched lockfile
        run: npm audit fix --package-lock-only

      - name: Reinstall from patched lockfile
        run: |
          rm -rf node_modules
          npm ci

      - name: Verify no vulnerabilities
        run: npm audit

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit patched lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock.json changes to commit."
            exit 0
          fi
          git config user.name "Workfolio Studio"
          git config user.email "brian.j.curr@gmail.com"
          git add package-lock.json
          git commit -m "Patch F-10 vulnerable dependency graph"
          git push origin HEAD:devops/f10-dependency-remediation
